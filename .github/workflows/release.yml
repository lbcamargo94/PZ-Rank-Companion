name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Inject SYNC_HMAC_SECRET
        env:
          SYNC_HMAC_SECRET: ${{ secrets.SYNC_HMAC_SECRET }}
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('main.js', 'utf8');
            const secret = process.env.SYNC_HMAC_SECRET;
            if (!secret) { console.error('SYNC_HMAC_SECRET nao configurado!'); process.exit(1); }
            content = content.replace(\"'__SYNC_HMAC_SECRET__'\", JSON.stringify(secret));
            fs.writeFileSync('main.js', content);
            console.log('SYNC_HMAC_SECRET injetado com sucesso.');
          "

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Inject SYNC_HMAC_SECRET
        env:
          SYNC_HMAC_SECRET: ${{ secrets.SYNC_HMAC_SECRET }}
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('main.js', 'utf8');
            const secret = process.env.SYNC_HMAC_SECRET;
            if (!secret) { console.error('SYNC_HMAC_SECRET nao configurado!'); process.exit(1); }
            content = content.replace(\"'__SYNC_HMAC_SECRET__'\", JSON.stringify(secret));
            fs.writeFileSync('main.js', content);
            console.log('SYNC_HMAC_SECRET injetado com sucesso.');
          "

      # Builda os artefatos Mac localmente sem tentar criar a release do GitHub.
      # O job Windows cria e publica a release; fazer POST /releases aqui causaria
      # 422 "already_exists" pois os dois jobs rodam em paralelo.
      - name: Build macOS app
        run: npm run build:mac

      # Aguarda a release existir (o job Windows pode terminar antes ou depois).
      # Faz upload dos artefatos Mac + latest-mac.yml diretamente na release existente.
      - name: Upload Mac artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Aguardando release $TAG (até 3 min)..."
          for i in $(seq 1 18); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            echo "  tentativa $i/18 — aguardando 10s..."
            sleep 10
          done
          echo "Fazendo upload dos artefatos Mac..."
          find dist -maxdepth 1 \( -name "*.dmg" -o -name "*.zip" -o -name "latest-mac.yml" \) \
            | xargs gh release upload "$TAG" --clobber

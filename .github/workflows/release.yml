name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.electron-cache
            ${{ github.workspace }}/.electron-builder-cache
          key: ${{ runner.os }}-node22-electron-${{ hashFiles('package-lock.json') }}

      - name: Cache node_modules (incl. native builds)
        uses: actions/cache@v4
        id: cache-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - name: Install setuptools (distutils para Python 3.12)
        run: pip install setuptools

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        if: steps.cache-modules.outputs.cache-hit != 'true'
        timeout-minutes: 15
        env:
          npm_config_msvs_version: '2022'
        run: npx electron-rebuild --verbose

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Inject SYNC_HMAC_SECRET
        env:
          SYNC_HMAC_SECRET: ${{ secrets.SYNC_HMAC_SECRET }}
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('main.js', 'utf8');
            const secret = process.env.SYNC_HMAC_SECRET;
            if (!secret) { console.error('SYNC_HMAC_SECRET nao configurado!'); process.exit(1); }
            content = content.replace(\"'__SYNC_HMAC_SECRET__'\", JSON.stringify(secret));
            fs.writeFileSync('main.js', content);
            console.log('SYNC_HMAC_SECRET injetado com sucesso.');
          "

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Aplica notas de release (RELEASE_NOTES.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md vazio ou ausente — pulando (release fica sem notas, sem notificacao no Discord)."
            exit 0
          fi
          echo "Aguardando release $TAG (até 15 min)..."
          for i in $(seq 1 90); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            echo "  tentativa $i/90 — aguardando 10s..."
            sleep 10
          done
          TITLE="$(head -n 1 RELEASE_NOTES.md)"
          tail -n +2 RELEASE_NOTES.md | sed '/./,$!d' > /tmp/release_body.md
          gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release_body.md

      # gh release edit acima usa o GITHUB_TOKEN automático do Actions — o GitHub
      # explicitamente NÃO dispara outros workflows (como o "release: edited" de
      # discord-release-notify.yml) para eventos gerados por esse token, só pra
      # edições feitas com um token/pessoa externa. Por isso postamos direto aqui,
      # em vez de depender daquele workflow (que só serve de rede de segurança pra
      # uma edição manual futura, feita por uma pessoa via `gh` local).
      - name: Notifica no Discord
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_BUGS_WEBHOOK_URL }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        shell: bash
        run: |
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md vazio ou ausente — pulando notificacao no Discord."
            exit 0
          fi
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          webhook = os.environ.get("WEBHOOK_URL")
          if not webhook:
              print("DISCORD_BUGS_WEBHOOK_URL nao configurado — pulando notificacao.")
              sys.exit(0)

          with open("RELEASE_NOTES.md", "r", encoding="utf-8") as f:
              lines = f.read().splitlines()
          title = (lines[0] if lines else "Nova versao").strip()
          body  = "\n".join(lines[1:]).strip()
          if not body:
              print("RELEASE_NOTES.md sem corpo — pulando notificacao no Discord.")
              sys.exit(0)
          if len(body) > 3900:
              body = body[:3900] + "\n…"

          embed = {
              "title": title[:256],
              "description": body,
              "color": 3447003,
              "url": os.environ.get("RELEASE_URL") or "",
              "footer": {"text": "PZ-Rank Companion (app)"},
          }
          req = urllib.request.Request(
              webhook,
              data=json.dumps({"embeds": [embed]}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "PZRank-DiscordNotifier/1.0 (+https://github.com/lbcamargo94)",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("Discord respondeu:", resp.status)
          except urllib.error.HTTPError as e:
              print("Discord respondeu com erro:", e.code, e.read().decode("utf-8", "replace"))
              raise
          PYEOF

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.electron-cache
            ${{ github.workspace }}/.electron-builder-cache
          key: ${{ runner.os }}-node22-electron-${{ hashFiles('package-lock.json') }}

      - name: Cache node_modules (incl. native builds)
        uses: actions/cache@v4
        id: cache-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        if: steps.cache-modules.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx electron-rebuild

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Inject SYNC_HMAC_SECRET
        env:
          SYNC_HMAC_SECRET: ${{ secrets.SYNC_HMAC_SECRET }}
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('main.js', 'utf8');
            const secret = process.env.SYNC_HMAC_SECRET;
            if (!secret) { console.error('SYNC_HMAC_SECRET nao configurado!'); process.exit(1); }
            content = content.replace(\"'__SYNC_HMAC_SECRET__'\", JSON.stringify(secret));
            fs.writeFileSync('main.js', content);
            console.log('SYNC_HMAC_SECRET injetado com sucesso.');
          "

      - name: Build Linux app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux

      - name: Upload Linux artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Aguardando release $TAG (até 15 min)..."
          for i in $(seq 1 90); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            echo "  tentativa $i/90 — aguardando 10s..."
            sleep 10
          done
          echo "Fazendo upload dos artefatos Linux..."
          find dist -maxdepth 1 \( -name "*.AppImage" -o -name "*.deb" -o -name "latest-linux.yml" \) \
            | xargs gh release upload "$TAG" --clobber

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.electron-cache
            ${{ github.workspace }}/.electron-builder-cache
          key: ${{ runner.os }}-node22-electron-${{ hashFiles('package-lock.json') }}

      - name: Cache node_modules (incl. native builds)
        uses: actions/cache@v4
        id: cache-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        if: steps.cache-modules.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx electron-rebuild --verbose

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Inject SYNC_HMAC_SECRET
        env:
          SYNC_HMAC_SECRET: ${{ secrets.SYNC_HMAC_SECRET }}
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('main.js', 'utf8');
            const secret = process.env.SYNC_HMAC_SECRET;
            if (!secret) { console.error('SYNC_HMAC_SECRET nao configurado!'); process.exit(1); }
            content = content.replace(\"'__SYNC_HMAC_SECRET__'\", JSON.stringify(secret));
            fs.writeFileSync('main.js', content);
            console.log('SYNC_HMAC_SECRET injetado com sucesso.');
          "

      - name: Build macOS app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac

      - name: Upload Mac artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Aguardando release $TAG (até 15 min)..."
          for i in $(seq 1 90); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            echo "  tentativa $i/90 — aguardando 10s..."
            sleep 10
          done
          echo "Fazendo upload dos artefatos Mac..."
          find dist -maxdepth 1 \( -name "*.dmg" -o -name "*.zip" -o -name "latest-mac.yml" \) \
            | xargs gh release upload "$TAG" --clobber
